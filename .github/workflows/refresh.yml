name: Refresh product data from dow.com

on:
  schedule:
    - cron: "59 4 1 * *"   # 1st of every month, 04:59 UTC
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        timeout-minutes: 10
        run: npm install --no-audit --no-fund
      - name: Read Dow's listings and update products.js
        run: node scripts/refresh.mjs
      - name: Read the technical data sheets into docs.js
        run: node scripts/build-docs.mjs
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add products.js docs.js extras.json
          git diff --cached --quiet || (git commit -m "Monthly refresh of product data and data sheet text from dow.com" && git push)
